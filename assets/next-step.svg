    <text x="133" y="151" text-anchor="middle" fill="#111527" font-family="Montserrat,Arial,sans-serif" font-weight="700" font-size="22">AI OPERATIONS</text>
  </g>
  <path d="M520 622 H810 M760 574 L822 622 L760 670" fill="none" stroke="#F1AB1C" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(920 430)">
    <rect width="520" height="380" rx="38" fill="#111527"/>
    <rect x="0" y="0" width="520" height="64" rx="38" fill="#111527"/>
    <rect x="0" y="26" width="520" height="38" fill="#111527"/>
    <circle cx="44" cy="32" r="8" fill="#F1AB1C"/>
    <circle cx="72" cy="32" r="8" fill="#C9B98A"/>
    <text x="260" y="41" text-anchor="middle" fill="#F6F0E2" font-family="Montserrat,Arial,sans-serif" font-weight="700" font-size="20">CHATGPT</text>
    <rect x="44" y="112" width="292" height="20" rx="10" fill="#F6F0E2" opacity="0.92"/>
