<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Drag the AI Operations folder into ChatGPT.</title>
  <desc id="desc">A folder moves by arrow into the ChatGPT window. Then say: Build my assistant.</desc>
  <rect width="1600" height="900" fill="#F6F0E2"/>
  <rect x="0" y="0" width="14" height="900" fill="#F1AB1C"/>
  <text x="86" y="116" fill="#F1AB1C" font-family="Montserrat,Arial,sans-serif" font-weight="700" font-size="24">M A N G O M A G I C</text>
  <text x="80" y="250" fill="#111527" font-family="Playfair Display,Georgia,serif" font-size="104">Drop it in.</text>
  <text x="84" y="322" fill="#1A1A1A" font-family="Playfair Display,Georgia,serif" font-style="italic" font-size="34">Then say: Build my assistant.</text>
  <g transform="translate(150 520)">
    <path d="M0 34 C0 18 12 6 28 6 H86 L112 34 H236 C254 34 266 46 266 64 V174 C266 192 254 204 236 204 H28 C12 204 0 192 0 176 Z" fill="#111527"/>
